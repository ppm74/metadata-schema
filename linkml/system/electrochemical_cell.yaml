id: https://echemdb.github.io/metadata-schema/system/electrochemical_cell
name: electrochemical_cell
description: Description of the electrochemical cell setup and configuration.

prefixes:
  echemdb: https://echemdb.github.io/metadata-schema/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - ../general/url
  - ../general/preparation_procedure

default_range: string

classes:
  ElectrochemicalCell:
    description: Description of the electrochemical cell setup and configuration.
    attributes:
      type:
        range: string
        description: Type of electrochemical cell, such as H-cell, beaker glass, flow cell.
        examples:
          - value: "H-cell"
          - value: "beaker glass"
          - value: "flow cell"
      parts:
        range: ElectrochemicalCellPart
        description: Functional parts of the cell that are in contact with or close to an electrolyte, such as the cell body, a membrane, a degasser or an electrode holder.
        multivalued: true
        inlined_as_list: true
      cellDescription:
        range: string
        description: Detailed description of the cell configuration.
        examples:
          - value: "Three-electrode setup with glass cell and Teflon cap"
      preparationProcedure:
        range: PreparationProcedure
        description: Procedures used to prepare the cell, such as cleaning, before the measurement.
        inlined: true
        examples:
          - value: "{description: ['Cleaned with aqua regia', 'Rinsed with ultrapure water', 'Dried in Ar stream']}"
      source:
        range: ElectrochemicalCellSource
        description: Source and supplier information for the cell.
        inlined: true

  ElectrochemicalCellPart:
    description: A functional part of the electrochemical cell that is in contact with or close to an electrolyte.
    attributes:
      name:
        range: string
        required: true
        description: Name of the part.
        examples:
          - value: "cell body"
          - value: "membrane"
          - value: "degasser"
      description:
        range: string
        description: Detailed description of the part.
        examples:
          - value: "Saturates the electrolyte with N2."
      comment:
        range: string
        description: Additional comment on the part.
        examples:
          - value: "Replaced after each measurement series."
      components:
        range: ElectrochemicalCellComponent
        description: What the part is made of. A part of a single material has one component.
        multivalued: true
        inlined_as_list: true

  ElectrochemicalCellComponent:
    description: A component of a part of the electrochemical cell, such as the glass tube or the membrane of a degasser.
    attributes:
      name:
        range: string
        description: Name of the component.
        examples:
          - value: "glass tube"
          - value: "membrane"
      material:
        range: string
        description: Material of the component.
        examples:
          - value: "borosilicate glass"
          - value: "Nafion"
          - value: "PTFE"
      description:
        range: string
        description: Detailed description of the component.
        examples:
          - value: "Cation exchange membrane."
      contact:
        range: string
        description: Names of the electrolytes in system.electrolytes that the component is in contact with. Omit for a component that is close to but not in contact with an electrolyte, such as a clamp holding an electrode.
        multivalued: true
        examples:
          - value: "[catholyte, anolyte]"
      source:
        range: ElectrochemicalCellComponentSource
        description: Source information for the component.
        inlined: true

  ElectrochemicalCellComponentSource:
    description: Source information for a component of the electrochemical cell.
    attributes:
      manufacturer:
        range: string
        description: Name of the manufacturer.
        examples:
          - value: "Chemours"
      supplier:
        range: string
        description: Name of the supplier.
        examples:
          - value: "Sigma-Aldrich"

  ElectrochemicalCellSource:
    description: Source information for the electrochemical cell.
    attributes:
      url:
        range: HttpUrl
        description: URL to product page or technical documentation.
        examples:
          - value: "https://your-cell-supplier.com/product/h-cell"
